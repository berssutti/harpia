services:
  harpia-web:
    build:
      context: ./harpia-web
    ports:
      # Bound to loopback by default. Put a TLS reverse proxy in front for any
      # remote access and set HARPIA_BIND_ADDR accordingly.
      - "${HARPIA_BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
      - NUXT_BACKEND_URL=http://harpia-backend:8000
      - NUXT_API_KEY=${HARPIA_API_KEY:?HARPIA_API_KEY must be set in .env}
      - NUXT_UI_USER=${HARPIA_UI_USER:-admin}
      - NUXT_UI_PASSWORD=${HARPIA_UI_PASSWORD:?HARPIA_UI_PASSWORD must be set in .env}
    depends_on:
      - harpia-backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  harpia-backend:
    build:
      context: ./harpia-backend
    ports:
      - "${HARPIA_BIND_ADDR:-127.0.0.1}:8000:8000"
    environment:
      - HARPIA_API_KEY=${HARPIA_API_KEY:?HARPIA_API_KEY must be set in .env}
      - HARPIA_CORS_ORIGINS=${HARPIA_CORS_ORIGINS:-}
      - WORKER_STALE_AFTER_SECONDS=${WORKER_STALE_AFTER_SECONDS:-90}
      - TELEGRAM_COMMAND_TTL_SECONDS=${TELEGRAM_COMMAND_TTL_SECONDS:-600}
    volumes:
      - ./harpia-backend/db:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/system/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  harpia-worker:
    build:
      context: ./harpia-worker
    environment:
      - BACKEND_URL=http://harpia-backend:8000
      - HARPIA_API_KEY=${HARPIA_API_KEY:?HARPIA_API_KEY must be set in .env}
      - WORKER_CONFIG_POLL_SECONDS=${WORKER_CONFIG_POLL_SECONDS:-30}
      - WORKER_HEARTBEAT_SECONDS=${WORKER_HEARTBEAT_SECONDS:-15}
      - WORKER_COMMAND_POLL_SECONDS=${WORKER_COMMAND_POLL_SECONDS:-2}
    depends_on:
      - harpia-backend
    volumes:
      - ./harpia-worker/session:/app/session
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json, os, urllib.request;
          req = urllib.request.Request(os.environ['BACKEND_URL'] + '/internal/worker/status',
          headers={'X-API-Key': os.environ['HARPIA_API_KEY']});
          data = json.load(urllib.request.urlopen(req, timeout=5));
          raise SystemExit(0 if data.get('connected') else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
